name: Release Please

# Opens and updates the release pull request on main, and tags vX.Y.Z when that
# pull request is merged. It does not deploy anything; deploys stay from main
# by scripts/deploy.sh. The action is pinned to a full commit id.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
